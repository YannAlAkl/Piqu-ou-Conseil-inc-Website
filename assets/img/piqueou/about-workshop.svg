<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" role="img" aria-label="Atelier de consultation : feuille de route de conformité présentée à une équipe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="500" height="620" fill="#F3F3F0"/>
<defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#D6D6D1"/></pattern></defs>
<rect width="500" height="620" fill="url(#dots)"/>
<!-- whiteboard -->
<rect x="40" y="50" width="420" height="300" rx="14" fill="#FFFFFF" stroke="#E3E3DF" stroke-width="2"/>
<rect x="40" y="50" width="420" height="46" rx="14" fill="#4A4A46"/>
<rect x="40" y="80" width="420" height="16" fill="#4A4A46"/>
<text x="64" y="80" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing="0.5">Feuille de route — conformité</text>
<!-- roadmap line -->
<path d="M80 150 H420" stroke="#E3E3DF" stroke-width="6" stroke-linecap="round"/>
<path d="M80 150 H300" stroke="#5E9E2F" stroke-width="6" stroke-linecap="round"/>
<g><circle cx="80" cy="150" r="16" fill="#5E9E2F" stroke="#5E9E2F" stroke-width="4"/><text x="80" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">1</text></g><g><circle cx="193" cy="150" r="16" fill="#5E9E2F" stroke="#5E9E2F" stroke-width="4"/><text x="193" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">2</text></g><g><circle cx="307" cy="150" r="16" fill="#5E9E2F" stroke="#5E9E2F" stroke-width="4"/><text x="307" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">3</text></g><g><circle cx="420" cy="150" r="16" fill="#FFFFFF" stroke="#5E9E2F" stroke-width="4"/><text x="420" y="155" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#5E9E2F">4</text></g>
<!-- gantt bars -->
<rect x="80" y="196" width="130" height="16" rx="8" fill="#6B6B66"/>
<rect x="160" y="226" width="150" height="16" rx="8" fill="#5E9E2F"/>
<rect x="250" y="256" width="120" height="16" rx="8" fill="#E0A33B"/>
<rect x="330" y="286" width="90" height="16" rx="8" fill="#E3E3DF"/>
<!-- sticky notes -->
<rect x="360" y="190" width="70" height="60" rx="4" fill="#FCE7A8" transform="rotate(6 395 220)"/>
<rect x="372" y="206" width="44" height="5" rx="3.5" fill="#E2C56B"/><rect x="372" y="218" width="36" height="5" rx="3.5" fill="#E2C56B"/><rect x="372" y="230" width="40" height="5" rx="3.5" fill="#E2C56B"/>
<!-- easel legs -->
<path d="M150 350 L120 440 M350 350 L380 440 M250 350 V430" stroke="#6B6B66" stroke-width="8" stroke-linecap="round"/>
<!-- presenter -->
<g transform="translate(420 300) scale(1.35)">
  <path d="M-44 120 C-44 70 -24 52 0 52 C24 52 44 70 44 120 Z" fill="#5E9E2F"/>
  <circle cx="0" cy="22" r="24" fill="#F1C9A5"/>
  <path d="M-24 18 C-22 -4 22 -4 24 18 C14 8 -14 8 -24 18 Z" fill="#4A4A46"/>
</g>
<path d="M390 395 L330 330" stroke="#5E9E2F" stroke-width="14" stroke-linecap="round"/>
<circle cx="326" cy="326" r="8" fill="#F1C9A5"/>
<!-- table + audience -->
<rect x="0" y="520" width="500" height="100" fill="#4A4A46"/>
<g transform="translate(90 440) scale(1.2)">
  <path d="M-44 120 C-44 70 -24 52 0 52 C24 52 44 70 44 120 Z" fill="#6B6B66"/>
  <circle cx="0" cy="22" r="24" fill="#F1C9A5"/>
  <path d="M-24 18 C-22 -4 22 -4 24 18 C14 8 -14 8 -24 18 Z" fill="#3B2A20"/>
</g>
<g transform="translate(210 452) scale(1.1)">
  <path d="M-44 120 C-44 70 -24 52 0 52 C24 52 44 70 44 120 Z" fill="#2E5A87"/>
  <circle cx="0" cy="22" r="24" fill="#F1C9A5"/>
  <path d="M-24 18 C-22 -4 22 -4 24 18 C14 8 -14 8 -24 18 Z" fill="#1a1a1a"/>
</g>
<g transform="translate(320 446) scale(1.15)">
  <path d="M-44 120 C-44 70 -24 52 0 52 C24 52 44 70 44 120 Z" fill="#34495E"/>
  <circle cx="0" cy="22" r="24" fill="#F1C9A5"/>
  <path d="M-24 18 C-22 -4 22 -4 24 18 C14 8 -14 8 -24 18 Z" fill="#6B4A2E"/>
</g>
<rect x="0" y="560" width="500" height="60" fill="#4A4A46"/>
<rect x="60" y="530" width="90" height="12" rx="3" fill="#FFFFFF" opacity="0.9"/>
<rect x="260" y="530" width="70" height="12" rx="3" fill="#FFFFFF" opacity="0.9"/>
</svg>