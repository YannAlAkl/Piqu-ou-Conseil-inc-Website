<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" role="img" aria-label="Rapport d'audit, liste de contrôles, matrice de risques et bouclier de conformité" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="600" height="620" fill="#F3F3F0"/>
