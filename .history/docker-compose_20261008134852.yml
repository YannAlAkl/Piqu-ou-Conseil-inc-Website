version: '3.8'

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # Port du serveur SMTP (pour envoyer les e-mails)
      - "8025:8025" # Port de l'interface Web (pour lire les e-mails)
    volumes:
      - mailpit-data:/data
    environment:
      - MP_MAX_MESSAGES=5000
      - MP_DATABASE=/data/mailpit.db

volumes:
  mailpit-data:
